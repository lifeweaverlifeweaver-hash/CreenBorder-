name: GuardStream Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  guardstream-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Сканиране за секрети (пароли и ключове)
      - name: GuardStream Secret Shield
        uses: gitleaks/gitleaks-action@v2

      # 2. Статичен анализ на кода (SAST)
      - name: GuardStream Code Audit
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/default
